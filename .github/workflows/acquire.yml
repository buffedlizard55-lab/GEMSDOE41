name: Verify official fault geometry archive
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public official archive and verify pinned bytes
        run: |
          mkdir -p official
          curl --fail --location --retry 3 --max-time 180 \
            https://gdr.openei.org/files/1391/qfaults_ingenious_nad83conus117_2023-06-27.zip \
            -o official/qfaults.zip
          unzip -t official/qfaults.zip
          echo 'c7b091c9ac8bca140ad89ee6bb2bd63dd3ac12e3013acbfd8373d11c9faee59d  official/qfaults.zip' | sha256sum --check -
          sha256sum official/qfaults.zip > official/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: verified-official-fault-geometry
          path: official/
          retention-days: 90
