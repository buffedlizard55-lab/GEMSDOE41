[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemsdoe41"
version = "0.1.0"
description = "Auditable structural-transfer fault-discovery experiments for the DOE GEMS challenge"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "rasterio>=1.4",
  "scipy>=1.15",
  "scikit-image>=0.25",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
